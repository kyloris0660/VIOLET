<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V.I.O.L.E.T. Production Launcher</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="header">
        <div>
          <p class="eyebrow">Production profile</p>
          <h1>V.I.O.L.E.T. Production Launcher</h1>
        </div>
        <div id="stateBadge" class="state state-gray">Not Checked</div>
      </section>

      <section id="summaryBar" class="summary-grid" aria-label="Production status summary">
        <div>
          <span>Profile</span>
          <strong id="profileSummary">Not checked</strong>
        </div>
        <div>
          <span>Environment</span>
          <strong id="envSummary">production</strong>
        </div>
        <div>
          <span>Storage</span>
          <strong id="storageSummary">Not checked</strong>
        </div>
        <div>
          <span>Database</span>
          <strong id="dbSummary">Not checked</strong>
        </div>
        <div>
          <span>Health</span>
          <strong id="healthSummary">Not checked</strong>
        </div>
      </section>

      <section class="workspace">
        <aside class="panel controls">
          <h2>Profile</h2>
          <p id="primaryMessage" class="message">Checking production profile...</p>

          <div class="form-grid" aria-label="Production profile editor">
            <label>
              <span>App port</span>
              <input id="appPortInput" inputmode="numeric" placeholder="8000">
            </label>
            <label>
              <span>DB host</span>
              <input id="dbHostInput" placeholder="localhost">
            </label>
            <label>
              <span>DB port</span>
              <input id="dbPortInput" inputmode="numeric" placeholder="5432">
            </label>
            <label>
              <span>DB name</span>
              <input id="dbNameInput" placeholder="blombooru">
            </label>
            <label>
              <span>DB user</span>
              <input id="dbUserInput" placeholder="postgres">
            </label>
            <label>
              <span>DB password</span>
              <input id="dbPasswordInput" type="password" autocomplete="off" placeholder="Optional">
            </label>
          </div>

          <div class="button-grid">
            <button id="createProfileButton">Create / Repair Production Profile</button>
            <button id="selectStorageButton">Select Production Storage Root</button>
            <button id="saveProfileButton">Save Profile Fields</button>
            <button id="testDbButton">Test Database</button>
            <button id="preflightButton" class="primary">Run Preflight</button>
            <button id="startButton" class="primary">Start Production</button>
            <button id="openBrowserButton">Open Browser</button>
            <button id="stopButton" class="danger">Stop</button>
            <button id="restartButton">Restart</button>
            <button id="copyDiagnosticsButton">Copy Diagnostic Summary</button>
          </div>
        </aside>

        <section class="panel checklist-panel">
          <div class="panel-heading">
            <h2>Preflight Checklist</h2>
            <span id="lastChecked">Not checked</span>
          </div>
          <div id="checklist" class="checklist"></div>
        </section>
      </section>

      <details id="advancedPanel" class="advanced">
        <summary>Show Advanced Diagnostics</summary>
        <pre id="advancedDiagnostics">{}</pre>
      </details>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
